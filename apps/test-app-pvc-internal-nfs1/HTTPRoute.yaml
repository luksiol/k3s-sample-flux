apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-app-pvc-internal-nfs1-route
  namespace: sample-apps
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-shared
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pvc-internal-nfs1
      backendRefs:
        - group: ''
          kind: Service
          name: test-app-pvc-internal-nfs1-service
          port: 80
          weight: 1
